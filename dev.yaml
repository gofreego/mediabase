LogConfig: true
Logger:
  AppName: mediabase
  Build: dev
  Level: debug
AppNames:
- HTTP_SERVER
- GRPC_SERVER
Server:
  GRPCPort: 8081
  HTTPPort: 80
Repository:
  Name : memory
Service:
  MaxFileSize: 52428800 # 50MB in bytes - raised from 5MB to fit uncompressed WAV audio clips
  AllowedContentTypes:
    - image/jpeg
    - image/png
    - image/webp
    - audio/mpeg
Storage:
  InternalHost: 192.168.1.100:9900
  PublicHost: https://media.zshala.com
  AccessKeyID: "minioadmin"
  SecretAccessKey: "minioadmin"
  Region: ""
  UseSSL: false
Debug:
  Enabled: true
  EnablePprof: true