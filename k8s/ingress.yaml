# media.zshala.com -> MinIO (see minio-external.yaml), NOT the mediabase app
# itself. mediabase generates presigned upload/download URLs that clients
# use to talk to MinIO's S3 API directly — this hostname is that presigned-
# URL target, matching what infra/docker/nginx/nginx/conf.d/mediabase.conf
# already proxies to (192.168.1.100:9900).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mediabase
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - media.zshala.com
      secretName: media-zshala-com-tls
  rules:
    - host: media.zshala.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio-external
                port:
                  name: http
