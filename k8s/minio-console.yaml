# minio.zshala.internal -> MinIO's web console (port 9001), for browsing
# buckets etc. Distinct from media.zshala.com, which is MinIO's S3 API (port
# 9900) used for presigned upload/download URLs — see minio-external.yaml.
# Same pure-IP-routing approach: MinIO isn't in the cluster yet, so this
# Service+Endpoints pair proxies to its existing LAN address.
#
# VPN/LAN-only, plain HTTP: minio.zshala.internal resolves only via the
# cluster's CoreDNS (infra repo's coredns_internal_hosts), which is VPN
# clients' DNS, and the Ingress allowlist (= infra's vpn_only_source_ranges,
# keep in sync) stops it being reached by Host header via the public IP.
apiVersion: v1
kind: Service
metadata:
  name: minio-console-external
spec:
  ports:
    - name: http
      port: 9001

---

apiVersion: v1
kind: Endpoints
metadata:
  name: minio-console-external
subsets:
  - addresses:
      - ip: 192.168.1.100
    ports:
      - name: http
        port: 9001

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minio-console
  annotations:
    nginx.ingress.kubernetes.io/whitelist-source-range: "172.18.0.0/16,192.168.1.0/24,10.244.0.0/16"
spec:
  ingressClassName: nginx
  rules:
    - host: minio.zshala.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio-console-external
                port:
                  name: http
